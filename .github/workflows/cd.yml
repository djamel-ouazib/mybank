name: CD MyBank

on:
    workflow_run:
        workflows: ['CI MyBank']
        types: [completed]
        branches: [main]

jobs:
    build-and-push:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Préparer les tags
              id: meta
              run: |
                  echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

            - name: Build backend image
              run: |
                  docker build \
                    -t ghcr.io/${{ github.repository_owner }}/mybank-backend:latest \
                    -t ghcr.io/${{ github.repository_owner }}/mybank-backend:${{ steps.meta.outputs.sha }} \
                    ./backend

            - name: Scan backend image (Trivy)
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  image-ref: ghcr.io/${{ github.repository_owner }}/mybank-backend:latest
                  format: table
                  exit-code: '0'
                  severity: CRITICAL,HIGH

            - name: Push backend image
              run: |
                  docker push ghcr.io/${{ github.repository_owner }}/mybank-backend:latest
                  docker push ghcr.io/${{ github.repository_owner }}/mybank-backend:${{ steps.meta.outputs.sha }}

            - name: Build frontend image
              run: |
                  docker build \
                    -t ghcr.io/${{ github.repository_owner }}/mybank-frontend:latest \
                    -t ghcr.io/${{ github.repository_owner }}/mybank-frontend:${{ steps.meta.outputs.sha }} \
                    ./frontend

            - name: Scan frontend image (Trivy)
              uses: aquasecurity/trivy-action@0.28.0
              with:
                  image-ref: ghcr.io/${{ github.repository_owner }}/mybank-frontend:latest
                  format: table
                  exit-code: '0'
                  severity: CRITICAL,HIGH

            - name: Push frontend image
              run: |
                  docker push ghcr.io/${{ github.repository_owner }}/mybank-frontend:latest
                  docker push ghcr.io/${{ github.repository_owner }}/mybank-frontend:${{ steps.meta.outputs.sha }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Copier docker-compose.prod.yml sur le VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: 'docker-compose.prod.yml'
                  target: '/home/deploy/mybank'

            - name: Deploy to VPS via SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      cd /home/deploy/mybank

                      echo "Pull images..."
                      docker compose -f docker-compose.prod.yml pull

                      echo "Restart containers..."
                      docker compose -f docker-compose.prod.yml up -d --remove-orphans
