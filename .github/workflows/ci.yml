# ─── Nom du workflow (visible dans l'interface GitHub Actions)
name: CI MyBank

# ─── Événements qui déclenchent ce workflow
on:
    push:
        branches: [main, develop] # Déclenché à chaque push sur ces branches
    pull_request:
        branches: [main, develop] # Déclenché à chaque PR vers ces branches

# ─── Les jobs du workflow (ici un seul)
jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout du code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Installation dépendances frontend
              run: npm ci
              working-directory: frontend

            - name: Build React
              run: npm run build
              working-directory: frontend

            - name: Lint ESLint
              run: npm run lint
              working-directory: frontend

            - name: Tests Vitest
              run: npm run test -- --reporter=verbose
              working-directory: frontend

    backend-tests:
        runs-on: ubuntu-latest

        services:
            db:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: mybank_test
                    MYSQL_USER: mybank
                    MYSQL_PASSWORD: secret
                    MYSQL_ROOT_PASSWORD: rootsecret
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-retries=5

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo, pdo_mysql

            - name: Install dépendances Composer
              run: composer install --no-interaction
              working-directory: backend

            - name: Créer la base de test + migrations
              run: |
                  php bin/console doctrine:database:create --env=test --if-not-exists
                  php bin/console doctrine:migrations:migrate --env=test --no-interaction
              working-directory: backend
              env:
                  DATABASE_URL: 'mysql://mybank:secret@127.0.0.1:3306/mybank'

            - name: Tests PHPUnit
              run: php bin/phpunit
              working-directory: backend
              env:
                  DATABASE_URL: 'mysql://mybank:secret@127.0.0.1:3306/mybank'
